name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Mock mode everywhere: no YouCam key exists in CI and none is ever added.
      YOUCAM_MODE: mock
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Test count in the job summary
        if: success()
        run: node scripts/test-count.mjs --summary >> "$GITHUB_STEP_SUMMARY"

      - name: Claim linter (no medical wording in UI copy or agent fixtures)
        run: npm run lint:claims

      - name: Build
        run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (mock mode, mobile and desktop)
        run: npm run test:e2e
        env:
          E2E_SKIP_BUILD: "1"

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test/e2e/.report
            test/e2e/.results
          retention-days: 14
          if-no-files-found: ignore
